<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08101d" />
    <title>AR Camera Model</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
  </head>
  <body>
    <main>
      <video id="camera-feed" muted playsinline></video>
      <div id="ui" aria-live="polite">
        <section id="intro" aria-labelledby="intro-title">
          <h1 id="intro-title">Welcome to the School of Belonging AR</h1>
          <p>Use your camera to explore the space around you. Turn to discover each school area, then tap a display to learn more about how it supports belonging.</p>
        </section>
        <article id="story-card" hidden>
          <h2 id="story-title"></h2>
          <p id="story-text"></p>
        </article>
        <p id="status">Start the camera to begin exploring.</p>
        <button id="start-camera" type="button">Start camera AR</button>
        <button id="enable-direction" type="button" hidden>Enable direction</button>
      </div>
    </main>
    <script src="sketch.js?v=clean-overlay-1"></script>
  </body>
</html>
