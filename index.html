<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08101d" />
    <title>School of Belonging AR</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <div id="loader"><strong>School of Belonging AR</strong><span>Allow camera access, then point at the printed marker.</span></div>
    <aside id="marker-help"><strong>Need the marker?</strong><a href="marker.html" target="_blank" rel="noreferrer">Open and print it</a></aside>
    <article id="story-card" hidden aria-live="polite"><h2 id="story-title"></h2><p id="story-text"></p></article>
    <p id="status" aria-live="polite">Point the camera at the printed marker.</p>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true" arjs="sourceType: webcam; detectionMode: mono; debugUIEnabled: false;">

        </a-entity>
        <a-entity class="area clickable" data-area="sports" position="1.8 0 -2.45" geometry="primitive: sphere; radius: 0.8" material="opacity: 0.01; transparent: true; depthWrite: false">
          <a-box position="0 0.03 0" width="1.55" height="0.08" depth="0.9" color="#f5f1e6"></a-box><a-box position="-0.28 0.09 0" width="0.9" height="0.04" depth="0.64" color="#48b0d4"></a-box><a-box position="-0.28 0.12 0" width="0.03" height="0.02" depth="0.6" color="#ffffff"></a-box><a-box position="0.58 0.08 0" width="0.5" height="0.05" depth="0.68" color="#d65e6d"></a-box><a-sphere position="0.58 0.2 0" radius="0.12" color="#f6d35c"></a-sphere>

        <a-entity class="area clickable" data-area="english" position="1.35 0 -0.7" geometry="primitive: sphere; radius: 0.65" material="opacity: 0.01; transparent: true; depthWrite: false">

          <a-cylinder position="0 0.3 0" radius="0.48" height="0.52" color="#b873a8"></a-cylinder><a-sphere position="0 0.66 0" radius="0.52" color="#efd3e9"></a-sphere><a-plane rotation="-90 0 0" position="-0.72 0.02 0.24" width="0.64" height="0.54" color="#9dca82"></a-plane><a-sphere position="-0.82 0.16 0.2" radius="0.14" color="#73ae6a"></a-sphere>

      <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>
    <script src="app.js?v=marker-ar-1"></script>

</html>
