<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>School of Belonging AR Marker</title>
    <style>
      body { margin: 0; padding: 30px; font-family: Arial, sans-serif; text-align: center; color: #122033; }
      img { display: block; width: min(80vw, 520px); margin: 24px auto; }
      p { max-width: 560px; margin: 12px auto; line-height: 1.45; }
      @media print { body { padding: 0; } h1, p { display: none; } img { width: 17cm; margin: 0 auto; } }
    </style>
  </head>
  <body>
    <h1>School of Belonging AR Marker</h1>
    <p>Print this marker at least 18 cm wide, place it flat, and keep it well lit. Scan the QR code to open the AR page, then point the phone at this marker.</p>
    <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="AR marker for the School of Belonging experience" />
    <p>Keep the full black border visible; it allows the camera to anchor the school in space.</p>
  </body>
</html>
